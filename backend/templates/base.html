<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}白蕉水产养殖管理平台{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">白蕉</span>
    <span class="brand-text">水产养殖管理平台</span>
  </div>
  <nav class="nav">
    <a href="/">鱼塘总览</a>
    <a href="/compare">多塘比较</a>
    <a href="/community">交流·排行</a>
    <a href="/review">待核查</a>
    <a href="/alerts">异常</a>
  </nav>
  <div class="user">
    <label>当前用户</label>
    <select id="userSelect"></select>
  </div>
  <div class="sim-switch" title="演示开关：控制内嵌终端仿真器">
    <span class="sim-label">终端仿真</span>
    <button id="simToggle" class="sim-btn" type="button" aria-pressed="false">
      <span class="sim-dot"></span><span id="simText">加载中…</span>
    </button>
  </div>
</header>
<div class="demo-banner">
  演示数据 / 演示规则：本页展示的数据与建议用于课程联调验证，<b>不得作为实际养殖依据</b>。
  <span id="simHint"></span>
</div>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="foot">
  软件实训课程作业 · 智能渔业-3组 ·
  <span id="footNote">数据来源：人工 / 仿真 / 实测分别标识</span>
</footer>
<script src="{{ url_for('static', filename='js/app.js') }}?v=4"></script>
{% block script %}{% endblock %}
</body>
</html>
